services:
  - type: web
    name: growthpilot-ai-api-satwiksairaj
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://growthpilot-ai-kohl.vercel.app
      - key: N8N_BASE_URL
        fromService:
          type: web
          name: growthpilot-ai-n8n-satwiksairaj
          property: host
      - key: N8N_WEBHOOK_SECRET
        fromService:
          type: web
          name: growthpilot-ai-n8n-satwiksairaj
          envVarKey: N8N_WEBHOOK_SECRET
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  - type: web
    name: growthpilot-ai-n8n-satwiksairaj
    runtime: docker
    plan: free
    dockerfilePath: ./n8n/Dockerfile
    dockerContext: ./n8n
    healthCheckPath: /healthz
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "true"
